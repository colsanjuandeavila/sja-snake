<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Serpiente Sabia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: una sola pantalla sin scroll. Menú = marca + tres modos + acciones. Juego = barra, enunciado, tablero cuadrado, ayuda (siempre en ese orden). */
:root{
  --bg:#E7EFEA; --surface:#F6FAF7; --fg:#12221B; --muted:#55695F; --line:#C5D4CB;
  --cell-a:#DCE8E0; --cell-b:#D0DFD6; --disc:#FFFFFFCC; --scrim:#E7EFEACC;
  --eco:#17874A; --math:#3566D9; --eng:#E8801A; --clean:#0B8A84;
  --on-eco:#FFFFFF; --on-math:#FFFFFF; --on-eng:#2A1500; --on-clean:#FFFFFF;
  --danger:#D13434; --on-danger:#FFFFFF; --ok:#13803F; --wall:#7F9A8B;
  --font-display:"Baloo 2", ui-rounded, "Nunito", system-ui, sans-serif;
  --font-body:"Nunito", ui-rounded, system-ui, sans-serif;
  --accent:var(--eco); --on-accent:var(--on-eco);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1914; --surface:#14241D; --fg:#E4EFE9; --muted:#8FA69A; --line:#243830;
    --cell-a:#15261E; --cell-b:#193027; --disc:#FFFFFF24; --scrim:#0D1914CC;
    --eco:#3FD17F; --math:#7C9DFF; --eng:#FFA445; --clean:#3CD6CF;
    --on-eco:#04210F; --on-math:#0A1534; --on-eng:#2A1500; --on-clean:#032321;
    --danger:#FF6B6B; --on-danger:#2B0A0A; --ok:#5BE08E; --wall:#4C6E5D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1914; --surface:#14241D; --fg:#E4EFE9; --muted:#8FA69A; --line:#243830;
  --cell-a:#15261E; --cell-b:#193027; --disc:#FFFFFF24; --scrim:#0D1914CC;
  --eco:#3FD17F; --math:#7C9DFF; --eng:#FFA445; --clean:#3CD6CF;
  --on-eco:#04210F; --on-math:#0A1534; --on-eng:#2A1500; --on-clean:#032321;
  --danger:#FF6B6B; --on-danger:#2B0A0A; --ok:#5BE08E; --wall:#4C6E5D;
  color-scheme:dark;
}
#app[data-mode="math"]{--accent:var(--math);--on-accent:var(--on-math)}
#app[data-mode="eng"]{--accent:var(--eng);--on-accent:var(--on-eng)}
#app[data-mode="clean"]{--accent:var(--clean);--on-accent:var(--on-clean)}

*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body);
  padding-block:clamp(6px,1.4vh,12px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{height:100%}
.view{width:100%;height:100%;margin:0 auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- Menú ---------- */
#menu{display:grid;align-content:center;gap:clamp(12px,3vh,24px);max-width:520px}
.brand{display:flex;flex-direction:column;gap:4px;min-height:0}
.brand svg{width:clamp(92px,17vh,136px);height:auto;display:block}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,min(11vw,7vh),54px);line-height:1;margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:clamp(14px,2.2vh,16px);line-height:1.35;max-width:34ch}
.modes{display:grid;gap:clamp(8px,1.6vh,12px)}
.mode{
  --m:var(--eco); --on-m:var(--on-eco); --g:clamp(44px,8vh,56px);
  display:grid;grid-template-columns:var(--g) minmax(0,1fr) auto;align-items:center;gap:14px;
  padding:clamp(8px,1.5vh,12px) 14px clamp(8px,1.5vh,12px) clamp(8px,1.5vh,12px);text-align:left;background:var(--surface);
  border:2px solid var(--line);border-radius:18px;transition:transform .12s,border-color .12s;
}
.mode[data-mode="math"]{--m:var(--math);--on-m:var(--on-math)}
.mode[data-mode="eng"]{--m:var(--eng);--on-m:var(--on-eng)}
.mode[data-mode="clean"]{--m:var(--clean);--on-m:var(--on-clean)}
.mode:hover{border-color:var(--m);transform:translateY(-1px)}
.mode:active{transform:scale(.985)}
.mode:focus-visible,.chip-btn:focus-visible{outline-color:var(--m, var(--accent))}
.glyph{width:var(--g);height:var(--g);border-radius:14px;background:var(--m);color:var(--on-m);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:clamp(19px,3.4vh,24px);line-height:1}
.mode .txt{min-width:0}
.mode strong{display:block;font-family:var(--font-display);font-size:clamp(18px,2.9vh,21px);font-weight:800;line-height:1.1}
.mode small{display:block;color:var(--muted);font-size:clamp(12px,1.9vh,14px);line-height:1.3;margin-top:2px}
.best{text-align:right;min-width:44px}
.best em{display:block;font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.best b{font-family:var(--font-display);font-size:clamp(20px,3.2vh,24px);font-variant-numeric:tabular-nums;line-height:1.1}
.menu-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.chip-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:800;font-size:14px}
.chip-btn svg{flex:none}
@media (max-height:720px){ .brand p{display:none} }
@media (max-height:700px){ .mode small{display:none} }
@media (max-height:760px){
  .brand svg{width:64px} h1{font-size:clamp(26px,min(8vw,5vh),38px)}
  #menu{gap:8px}
  .modes{gap:6px}
  .mode{--g:40px;padding:5px 12px 5px 6px;gap:10px;border-radius:14px}
  .glyph{border-radius:11px;font-size:18px}
  .mode strong{font-size:17px}
  .best b{font-size:19px}
  .custom{padding:6px 10px;gap:4px}
  .chip-btn{padding:6px 12px}
}
@media (min-aspect-ratio:6/5) and (max-height:640px){
  #menu{max-width:880px;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-areas:"brand modes" "custom modes" "foot modes";align-content:center;align-items:center;column-gap:28px;row-gap:16px}
  .brand{grid-area:brand;align-self:end}
  .custom{grid-area:custom}
  .menu-foot{grid-area:foot;align-self:start}
  .modes{grid-area:modes}
  .brand p{display:block}
}
@media (min-aspect-ratio:6/5) and (max-height:430px){ .brand p{display:none} .mode small{display:none} }

/* ---------- Personalizar (en el menú) ---------- */
.sheet{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--scrim)}
.sheet[hidden]{display:none}
.sheet-card{width:min(100%,600px);max-height:100%;overflow:auto;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:clamp(12px,2.4vh,20px);display:flex;flex-direction:column;gap:clamp(10px,2vh,16px)}
.sheet-card h2{margin:0;font-family:var(--font-display);font-size:19px;font-weight:800}
.sheet .btn{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.sheet .btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.custom{display:grid;gap:clamp(5px,1vh,9px);padding:clamp(8px,1.4vh,12px) 12px;background:var(--surface);border:2px solid var(--line);border-radius:18px}
.crow{display:grid;gap:4px;min-width:0}
.clabel{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.clabel em{display:inline;font-style:normal;text-transform:none;letter-spacing:0;color:var(--fg);font-size:12px;margin-left:4px}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);background:var(--c,var(--muted));box-shadow:0 0 0 2px var(--line);padding:0}
.sw.rainbow{background:conic-gradient(#ef4444,#f97316,#eab308,#22c55e,#06b6d4,#3b82f6,#8b5cf6,#ec4899,#ef4444)}
.sw[aria-checked="true"]{box-shadow:0 0 0 3px var(--fg)}
.shapes{display:flex;flex-wrap:wrap;gap:6px}
.shape-btn{width:44px;height:36px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.shape-btn[aria-checked="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg)}
.shape-btn .s{stroke:var(--skin)}
.shape-btn .f{fill:var(--skin)}
.rainbow-skin .shape-btn .s{stroke:url(#rbw)}
.rainbow-skin .shape-btn .f :nth-child(1){fill:#ef4444}
.rainbow-skin .shape-btn .f :nth-child(2){fill:#eab308}
.rainbow-skin .shape-btn .f :nth-child(3){fill:#22c55e}
.rainbow-skin .shape-btn .f :nth-child(4){fill:#3b82f6}
.mark-body{stroke:var(--skin)}
.mark-head{fill:var(--skin)}
.rainbow-skin .mark-body{stroke:url(#rbw)}
.rainbow-skin .mark-head{fill:#8b5cf6}
.seg{display:inline-flex;justify-self:start;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:800;font-size:13px;color:var(--fg)}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-checked="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible{outline-offset:-3px}

/* ---------- Juego ---------- */
#game{
  display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:clamp(6px,1.3vh,10px);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
#game[hidden],#menu[hidden]{display:none}
.bar{display:flex;align-items:center;gap:8px;min-width:0}
.icon-btn{width:40px;height:40px;flex:none;display:grid;place-items:center;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.icon-btn[hidden]{display:none}
.bar .name{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.stat{display:flex;flex-direction:column;align-items:flex-end;min-width:46px;line-height:1}
.stat span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat b{font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}

.prompt{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;min-height:clamp(56px,9vh,72px);padding:8px 14px;background:var(--surface);border:2px solid var(--line);border-radius:16px}
.prompt.mem{border-color:var(--accent)}
.prompt.inv{border-color:var(--danger)}
.prompt.inv .lbl{color:var(--danger)}
.prompt .qwrap{display:flex;flex-direction:column;min-width:0;flex:1 1 130px}
.prompt .lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800;line-height:1.25}
.prompt .q{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,min(8.5vw,5.6vh),38px);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.prompt .q.word{font-size:clamp(24px,min(7vw,5vh),34px)}
.prompt .q.masked{letter-spacing:.18em;color:var(--muted)}
.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.88);opacity:.4}100%{transform:scale(1);opacity:1}}
.side{display:flex;align-items:center;gap:2px;flex:none}
.heart{display:block}
.heart.on{fill:var(--danger)}
.heart.off{fill:none;stroke:var(--muted);stroke-width:1.6;opacity:.55}
.legend{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 auto}
.lg{display:flex;align-items:center;gap:8px;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden}
.lg i{font-style:normal;letter-spacing:3px}
.tag{font-family:var(--font-display);font-weight:800;font-size:13px;padding:1px 10px;border-radius:999px;flex:none}
.tag.good{background:var(--accent);color:var(--on-accent)}
.tag.bad{background:var(--danger);color:var(--on-danger)}
.say{border-color:var(--accent)}

.board-area{min-width:0;min-height:0;display:grid;place-items:center}
.board-wrap{position:relative;box-sizing:content-box;border:4px solid var(--wall);border-radius:16px;overflow:hidden;background:var(--cell-a);width:240px;height:240px}
.board-wrap canvas{display:block}
.banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:92%;padding:6px 14px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-family:var(--font-display);font-weight:800;font-size:clamp(13px,3.4vmin,19px);line-height:1.2;text-align:center;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.banner[hidden]{display:none}
.banner.rule{background:var(--fg);color:var(--bg)}
.start-hint{position:absolute;left:8px;right:8px;bottom:8px;padding:8px 12px;border-radius:14px;background:var(--scrim);border:2px solid var(--line);text-align:center;font-size:clamp(12px,3vmin,15px);line-height:1.35;pointer-events:none}
.start-hint[hidden]{display:none}
.start-hint b{font-family:var(--font-display);font-weight:800}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:10px;background:var(--scrim)}
.overlay[hidden]{display:none}
.card{width:min(100%,330px);max-height:100%;overflow:auto;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:clamp(12px,3vmin,18px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.6vmin,10px)}
.card h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(22px,5.6vmin,28px);line-height:1.05}
.card p{margin:0;color:var(--muted);font-size:clamp(13px,3.2vmin,15px);line-height:1.4}
.card .big{font-family:var(--font-display);font-weight:800;font-size:clamp(40px,10vmin,56px);line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
.card .badge{font-family:var(--font-display);font-weight:800;font-size:14px;padding:2px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.compact .tip{display:none}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font-family:var(--font-display);font-weight:800;font-size:clamp(15px,3.6vmin,18px);line-height:1.1}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:active{transform:scale(.97)}
.mx{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px;width:100%}
.mx div{background:var(--bg);border-radius:10px;padding:5px 4px}
.mx b{display:block;font-family:var(--font-display);font-size:clamp(16px,4.4vmin,20px);line-height:1.15;font-variant-numeric:tabular-nums}
.mx span{font-size:11px;color:var(--muted);line-height:1.2}
.res-mode{padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.res-mode:first-child{border-top:0}
.res-mode strong{font-family:var(--font-display);font-size:16px}
.res-list{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.res-list th,.res-list td{text-align:left;padding:4px 6px;border-top:1px solid var(--line)}
.res-list th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.res-empty{color:var(--muted);margin:0}
.hint{margin:0;text-align:center;color:var(--muted);font-size:13px;line-height:1.3}

/* La barra y la pregunta siempre van arriba del tablero; en pantallas anchas el bloque se centra. */
#game{max-width:640px}
@media (max-height:520px){
  .hint{display:none}
  #game{grid-template-rows:auto auto minmax(0,1fr)}
  .prompt{min-height:0;padding:6px 12px}
  .prompt .q{font-size:clamp(22px,7vh,30px)}
  .icon-btn{width:36px;height:36px}
}

@media (prefers-reduced-motion: reduce){
  .pop{animation:none}
  .mode{transition:none}
}
</style>

</head><body>
<div id="app" data-mode="health">
  <section id="menu" class="view">
    <header class="brand">
      <svg viewBox="0 0 136 52" aria-hidden="true">
        <defs><linearGradient id="rbw" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#ef4444"/><stop offset=".25" stop-color="#eab308"/><stop offset=".5" stop-color="#22c55e"/><stop offset=".75" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
        <path class="mark-body" d="M10 40 C 26 8, 46 8, 62 30 S 98 48, 118 18" fill="none" stroke-width="13" stroke-linecap="round"/>
        <path d="M10 40 C 26 8, 46 8, 62 30 S 98 48, 118 18" fill="none" stroke="var(--surface)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 16" opacity=".7"/>
        <circle class="mark-head" cx="119" cy="17" r="9"/>
        <circle cx="121.5" cy="13.5" r="3" fill="var(--surface)"/><circle cx="122.5" cy="13.5" r="1.3" fill="var(--fg)"/>
        <circle cx="124.5" cy="20.5" r="3" fill="var(--surface)"/><circle cx="125.5" cy="20.5" r="1.3" fill="var(--fg)"/>
      </svg>
      <h1>Serpiente Sabia</h1>
      <p>Desliza, come y aprende. Elige un modo para empezar.</p>
    </header>
    <div class="modes">
      <button class="mode" data-mode="health" type="button">
        <span class="glyph" aria-hidden="true">🍎</span>
        <span class="txt"><strong>Saludable</strong><small>Come frutas y verduras, esquiva la chatarra.</small></span>
        <span class="best"><em>Récord</em><b id="best-health">0</b></span>
      </button>
      <button class="mode" data-mode="math" type="button">
        <span class="glyph" aria-hidden="true">7×8</span>
        <span class="txt"><strong>Matemático</strong><small>Come el número que resuelve la operación.</small></span>
        <span class="best"><em>Récord</em><b id="best-math">0</b></span>
      </button>
      <button class="mode" data-mode="eng" type="button">
        <span class="glyph" aria-hidden="true">Aa</span>
        <span class="txt"><strong>Inglés</strong><small>Lee la palabra y come el icono correcto.</small></span>
        <span class="best"><em>Récord</em><b id="best-eng">0</b></span>
      </button>
      <button class="mode" data-mode="clean" type="button">
        <span class="glyph" aria-hidden="true">🧹</span>
        <span class="txt"><strong>Orden y aseo</strong><small>Limpia el parque, el salón y la cancha.</small></span>
        <span class="best"><em>Récord</em><b id="best-clean">0</b></span>
      </button>
    </div>
    <div class="custom">
      <div class="crow"><span class="clabel">Piel <em id="skin-name"></em></span><div class="swatches" id="swatches" role="radiogroup" aria-label="Piel de la serpiente"></div></div>
      <div class="crow"><span class="clabel">Forma <em id="shape-name"></em></span><div class="shapes" id="shapes" role="radiogroup" aria-label="Forma de la serpiente"></div></div>
      <div class="crow"><span class="clabel">Velocidad</span><div class="seg" id="speed" role="radiogroup" aria-label="Velocidad"></div></div>
    </div>
    <div class="menu-foot">
      <button class="chip-btn" id="btn-results" type="button" aria-haspopup="dialog">Mis resultados</button>
      <button class="chip-btn" id="btn-sound-menu" type="button" aria-pressed="true"></button>
    </div>
  </section>

  <section id="game" class="view" hidden>
    <div class="bar">
      <button class="icon-btn" id="btn-back" type="button" aria-label="Volver al menú"></button>
      <div class="name"><span class="dot"></span><span id="mode-name">Saludable</span></div>
      <div class="stat"><span>Puntos</span><b id="score">0</b></div>
      <div class="stat"><span>Récord</span><b id="best">0</b></div>
      <button class="icon-btn" id="btn-pause" type="button" aria-label="Pausar"></button>
    </div>
    <div class="prompt" id="prompt"></div>
    <div class="board-area" id="board-area">
      <div class="board-wrap" id="board-wrap">
        <canvas id="cv" aria-label="Tablero del juego"></canvas>

let actx = null;
function tone(f,d,type,v,delay,slide){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const o=actx.createOscillator(), g=actx.createGain(), t0=actx.currentTime+(delay||0);
    o.type=type||'sine';
    o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
    g.gain.setValueAtTime(v||.1,t0);
    g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0+d+.03);
  }catch(e){}
}
function sfx(k){

/* Tiempo de reacción garantizado: un icono nuevo nunca aparece a menos de ~0,8 s de la cabeza
   (a la velocidad actual), y si queda en la línea de avance se exige un poco más. */
const REACT_MS = 800;
function reactCells(){ return Math.max(4,Math.min(8,Math.ceil(REACT_MS/st.tickMs))); }
function freeCell(minHead,minItem){
  const occ=new Set();
  st.snake.forEach(p=>occ.add(p.x+','+p.y));
  st.items.forEach(p=>occ.add(p.x+','+p.y));
  const h=st.snake[0], d=st.dir;
  const need=Math.max(minHead,reactCells());
  /* Antes de empezar, la pista cubre las últimas filas: ahí no se coloca nada para que todo se vea. */
  const lowCut = st.started ? N : N-4;
  const farEnough=(x,y)=>{
    const dx=x-h.x, dy=y-h.y, dist=wd(x,h.x)+wd(y,h.y);
    const ahead=dx*d.x+dy*d.y, side=Math.abs(dx*d.y-dy*d.x);
    return dist >= need + (ahead>0 && side<=1 ? 2 : 0);
  };
  for(let t=0;t<400;t++){
    const x=rand(N), y=rand(N);
    if(y>=lowCut || occ.has(x+','+y) || !farEnough(x,y)) continue;
    let ok=true;
    for(const it of st.items){ if(wd(x,it.x)+wd(y,it.y)<minItem){ ok=false; break; } }
    if(ok) return {x,y};
  }
  /* Si el tablero está muy lleno, se elige la celda libre más lejana de la cabeza. */
  let bestC=null, bestD=-1;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    if(occ.has(x+','+y) || y>=lowCut) continue;
    const dist=wd(x,h.x)+wd(y,h.y);
    if(dist>bestD){ bestD=dist; bestC={x,y}; }
  }
  return bestC;
}

/* ---------- Avisos sobre el tablero ---------- */
function showBanner(text,kind,ms){

/* ---------- Modo saludable ---------- */
const ruleMatch = it => it.kind==='good' && (st.rule==='all' || it.group===st.rule);

function fillHealth(){
  const n=st.goodCount;
  const goodTarget=Math.min(4,2+Math.floor(n/8));
  const badTarget=n<1?0:Math.min(3,1+Math.floor(n/6));
  const wrongTarget=st.rule==='all'?0:1;
  const poolG=Math.min(HEALTHY.length,3+Math.floor(n/3));
  const poolB=Math.min(JUNK.length,3+Math.floor(n/3));
  let active=0, wrong=0, bad=0;
  st.items.forEach(i=>{ if(i.kind==='bad') bad++; else if(ruleMatch(i)) active++; else wrong++; });
  const add=(kind,list,size,minHead)=>{
    const c=freeCell(minHead,3); if(!c) return;
    const onBoard=st.items.map(i=>i.emoji);
    let opts=list.slice(0,size).filter(e=>!onBoard.includes(e[0]));
    if(!opts.length) opts=list.slice(0,size);
    if(!opts.length) opts=list;
    const e=pick(opts);
    st.items.push({kind:kind, emoji:e[0], name:e[1], group:e[2], x:c.x, y:c.y});
  };
  const healthyBy = (rule,positive) => HEALTHY.filter(e=>positive ? (rule==='all'||e[2]===rule) : e[2]!==rule);
  /* Con una regla activa, el grupo elegido se toma de toda la lista, no solo del tramo inicial. */
  const sizeFor = (rule,positive) => st.rule==='all' ? poolG : HEALTHY.length;
  while(active<goodTarget){ add('good',healthyBy(st.rule,true),sizeFor(),3); active++; }
  while(wrong<wrongTarget){ add('good',healthyBy(st.rule,false),sizeFor(),3); wrong++; }
  while(bad<badTarget){ add('bad',JUNK,poolB,4); bad++; }
}
function legendHTML(){
  if(st.mode==='clean'){

    return '<div class="lg"><span class="tag good">'+sc.name+' · quedan '+st.left+'</span><i>'+sc.trash.slice(0,3).map(e=>e[0]).join('')+'</i></div>'+
           '<div class="lg"><span class="tag bad">No es basura −1 vida</span><i>'+sc.keepList.slice(0,3).map(e=>e[0]).join('')+'</i></div>';
  }
  const r=st.rule;
  const tag = r==='all' ? 'Frutas y verduras +10' : (r==='fruta' ? 'Solo FRUTAS +10' : 'Solo VERDURAS +10');
  const ex  = r==='all' ? '🍎🥦' : (r==='fruta' ? '🍎🍌🍓' : '🥕🥦🥬');
  return '<div class="lg"><span class="tag good">'+tag+'</span><i>'+ex+'</i></div>'+
         '<div class="lg"><span class="tag bad">Evita −1 vida</span><i>🍔🍩🍟</i></div>';
}

function nextRule(){
  const s=st;

    const seq=shuffle(['fruta','verdura','all']);
    if(seq[seq.length-1]===s.rule) seq.reverse();
    s.ruleSeq=seq;
  }
  let next=s.ruleSeq.pop();
  if(next===s.rule) next = s.ruleSeq.length ? s.ruleSeq.pop() : (s.rule==='all'?'fruta':'all');
  s.rule=next; s.ruleLeft = next==='all' ? 4 : 5;
  updateLegend();
  s.hold=1100;
  showBanner(next==='all' ? '¡Regla normal! Frutas y verduras'
                          : '¡Cambio de regla! Ahora solo '+(next==='fruta'?'FRUTAS':'VERDURAS'), 'rule', 2800);
  sfx('rule');
}

  s.dir={x:1,y:0}; s.queue=[]; s.grow=0; s.acc=0; s.maxShown=false;
  s.started=false; s.running=false; s.items=[]; s.popups=[]; s.hold=0;
  const n=sc.count+2*s.round, k=Math.min(4,sc.keep+Math.floor(s.round/2));
  const pickN=(list,cnt)=>{ const out=[]; let pool=[]; while(out.length<cnt){ if(!pool.length) pool=shuffle(list.slice()); out.push(pool.pop()); } return out; };
  pickN(sc.trash,n).forEach(e=>{ const p=freeCell(3,2); if(p) s.items.push({kind:'good',emoji:e[0],name:e[1],x:p.x,y:p.y}); });
  pickN(sc.keepList,k).forEach(e=>{ const p=freeCell(3,2); if(p) s.items.push({kind:'bad',emoji:e[0],name:e[1],x:p.x,y:p.y}); });
  s.left=s.items.filter(i=>i.kind==='good').length;
  updateLegend(); updateHUD(); showStartHint();
}
function sceneComplete(){
  const s=st, sc=curScene();
  s.running=false; s.acc=0; s.scenesDone++;
  addScore(30);
  s.popups.push({cx:s.snake[0].x,cy:s.snake[0].y,text:'+30',kind:'ok',age:0});
  showBanner(sc.clean+' +30','rule',2200);
  sfx('rule'); tone(784,.18,'triangle',.12,.2);
  s.scene++; if(s.scene%SCENES.length===0) s.round++;
  s.sceneT=1900;
  updateHUD();
}

/* ---------- Modo matemático ---------- */
function genMath(){
  const lvl=Math.min(2,Math.floor(st.correct/4));
  const ops=lvl===0?['+','-']:lvl===1?['+','-','×']:['+','-','×','÷'];
  const op=pick(ops);
  const between=(lo,hi)=>lo+rand(hi-lo+1);
  let a,b,ans;
  if(op==='+'){
    const r=lvl===0?[1,10]:lvl===1?[5,30]:[10,49];
    a=between(r[0],r[1]); b=between(r[0],r[1]); ans=a+b;
  } else if(op==='-'){
    if(lvl===0){ a=between(3,15); b=between(1,a-1); }
    else if(lvl===1){ a=between(10,60); b=between(2,a-1); }
    else { a=between(25,99); b=between(5,a-1); }
    ans=a-b;
  } else if(op==='×'){
    if(lvl===1){ a=between(2,5); b=between(2,9); } else { a=between(2,9); b=between(2,9); }
    ans=a*b;
  } else {
    b=between(2,9); ans=between(2,9); a=b*ans;
  }
  const cand=[ans+1,ans-1,ans+2,ans-2,ans+3,ans-3,ans+10,ans-10];
  if(op==='×') cand.push(a+b);
  if(op==='+') cand.push(Math.abs(a-b));
  if(op==='-') cand.push(a+b);
  const pool=shuffle(Array.from(new Set(cand)).filter(v=>v!==ans && v>=0 && v<=99));
  const total=st.correct<3?3:4;
  const nums=[ans].concat(pool.slice(0,total-1));
  while(nums.length<total){ const v=rand(100); if(!nums.includes(v)) nums.push(v); }
  const sym={'+':'+','-':'−','×':'×','÷':'÷'}[op];
  return {
    text:a+' '+sym+' '+b+' = ?',
    options:nums.map(v=>({kind:'num', value:v, isAnswer:v===ans}))
  };
}

/* ---------- Modo inglés ---------- */
function genEng(){
  let t;
  do { t=pick(WORDS); } while(st.lastWord && t[0]===st.lastWord);
  st.lastWord=t[0];
  const total=st.correct<3?3:4;
  const others=shuffle(WORDS.filter(w=>w[0]!==t[0])).slice(0,total-1);
  return {
    word:t[0],
    options:[t].concat(others).map(w=>({kind:'icon', emoji:w[1], word:w[0], isAnswer:w===t}))
  };
}

function placeOptions(opts){
  st.items=[];
  opts.forEach(o=>{
    const c=freeCell(3,3);
    if(c){ o.x=c.x; o.y=c.y; st.items.push(o); }
  });
}

/* Cada 5 aciertos hay una ronda inversa (comer lo que NO es) y, entre medias, una ronda de memoria. */
function questionKind(){
  const n=st.correct;
  if(n>=5 && n%5===0) return 'inverse';
  if(n>=3 && n%5===3) return 'memory';
  return 'normal';
}
function renderQ(){
  const s=st, q=s&&s.q, el=$('#q-text'); if(!q||!el) return;
  const math=s.mode==='math';
  let text = math ? q.text : cap(q.word);
  let label = math ? 'Come la respuesta' : 'Come el icono de';
  let masked=false;
  if(q.kind==='memory'){
    if(q.hidden){
      text = math ? q.text.replace(/\d/g,'•') : '•'.repeat(q.word.length);
      masked=true; label='Memoria · ¿lo recuerdas?';
    } else label='Memoria · míralo bien';
  } else if(q.kind==='inverse'){
    label = math ? '¡Cambio! NO comas la respuesta' : '¡Cambio! NO comas el icono de';
  }
  el.textContent=text;
  el.classList.toggle('masked',masked);
  const lb=$('#q-lbl'); if(lb) lb.textContent=label;
  promptEl.classList.toggle('mem',q.kind==='memory');
  promptEl.classList.toggle('inv',q.kind==='inverse');
  const pk=$('#btn-peek'); if(pk) pk.hidden=!(q.kind==='memory' && q.hidden);
}
function bumpQ(){
  const q=$('#q-text'); if(!q) return;
  q.classList.remove('pop'); void q.offsetWidth; q.classList.add('pop');
}
function newQuestion(){
  const s=st, math=s.mode==='math';
  const kind=questionKind();
  const g = math ? genMath() : genEng();
  g.kind=kind; g.peeked=false; g.hidden=false; g.t0=s.t;
  g.showUntil = kind==='memory' ? s.t + (math?4500:3500) : Infinity;
  g.options.forEach(o=>{ o.correct = kind==='inverse' ? !o.isAnswer : o.isAnswer; });
  s.q=g;
  placeOptions(g.options);
  renderQ(); bumpQ();
  if(s.started){
    if(!math) say(g.word);
    if(kind==='inverse'){
      showBanner('¡Cambio de regla! Ahora NO comas '+(math?'la respuesta':'ese icono'),'rule',2800);
      s.hold=1100; sfx('rule');
    } else if(kind==='memory'){
      showBanner('Ronda de memoria · +20 si no miras de nuevo','mem',2800);
    }
  }
}
function updateQ(){
  const q=st.q; if(!q||q.kind!=='memory'||q.hidden) return;
  if(st.t>=q.showUntil){ q.hidden=true; renderQ(); }
}
function peek(){
  const s=st; if(!s||!s.q||s.paused||s.over||!s.started) return;
  const q=s.q; if(q.kind!=='memory'||!q.hidden) return;
  q.hidden=false; q.peeked=true; q.showUntil=s.t+1600;
  renderQ();
  if(s.mode==='eng') say(q.word);
}

function updateLen(){

/* El tablero ocupa el mayor cuadrado que cabe en su zona, en múltiplos de la cuadrícula. */
function fit(){
  const aw=areaEl.clientWidth, ah=areaEl.clientHeight;
  if(!aw||!ah) return;
  let size=Math.floor(Math.min(aw,ah)-8-2);
  size=Math.max(N*8,Math.floor(size/N)*N);
  wrap.style.width=size+'px'; wrap.style.height=size+'px';
  dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(size*dpr); cv.height=Math.round(size*dpr);
  cv.style.width=size+'px'; cv.style.height=size+'px';
  boardPx=size;
  wrap.classList.toggle('compact',size<330);
}

  gameEl.hidden = v!=='game';
}

}

function startGame(m){

  updateHUD(); showStartHint();

  last=performance.now(); raf=requestAnimationFrame(frame);
}

/* ---------- Control ---------- */
/* La serpiente espera quieta hasta la primera dirección. Después avanza celda a celda
   y los giros ocurren en el centro de la celda, como en el Snake de Google. */
function startRun(){
  st.started=true; st.running=true; st.acc=0;
  startHintEl.hidden=true;
  if(st.mode==='eng') say(st.q.word);
}
function turn(dx,dy){
  const s=st;
  if(!s||s.over||s.paused) return;
  if(!s.started){
    if(dx===-1) return;
    s.dir={x:dx,y:dy}; startRun(); return;
  }
  const pend=s.queue.length?s.queue[s.queue.length-1]:s.dir;
  if(dx===pend.x && dy===pend.y) return;
  if(dx===-pend.x && dy===-pend.y) return;
  if(s.queue.length<2) s.queue.push({x:dx,y:dy});
}
function setPause(p){
  if(!st||st.over||!st.started) return;
  st.paused=p;
  $('#btn-pause').innerHTML=p?ICON.play:ICON.pause;
  if(p) showOverlay('pause'); else hideOverlay();
}

/* ---------- Lógica ---------- */
function addScore(d){ st.score=Math.max(0,st.score+d); }
function speedUp(n){ st.tickMs=Math.max(minTick(st.mode), baseTick(st.mode)-4*n); }
function popup(it,text,kind){ st.popups.push({cx:it.x,cy:it.y,text,kind,age:0}); }
function hurt(){ st.flash=1; st.shake=RM?0:1; try{ navigator.vibrate&&navigator.vibrate(40); }catch(e){} }

function gameOver(reason,freezeK){
  st.over=true; st.running=false; st.acc=0; st.reason=reason; st.overT=0; st.freezeK=freezeK||0;
  sfx('over');
  const rec=st.score>best[st.mode];
  if(rec){ best[st.mode]=st.score; store.set('sw-best-'+st.mode,String(st.score)); }
  st.newRecord=rec&&st.score>0;
  saveSession();
  updateHUD();
}

function growSnake(){
  if(st.snake.length+st.grow<MAX_LEN){ st.grow+=1; return; }
  if(!st.maxShown){
    st.maxShown=true;
    st.popups.push({cx:st.snake[0].x,cy:st.snake[0].y,text:'¡Máximo!',kind:'ok',age:0});
  }
}

/* Métricas de conocimiento: solo cuentan los intentos de comer. Chocar con la pared o la cola no las afecta. */
function track(it){
  const s=st, m=s.m;
  if(s.mode==='clean'){ const ok=it.kind==='good'; m.att++; if(ok) m.hit++; else m.err++; return; }
  if(s.mode==='health'){
    const ok = it.kind==='good' && (s.rule==='all' || it.group===s.rule);
    m.att++; if(ok) m.hit++; else m.err++;
    if(it.kind==='good' && s.rule!=='all'){ m.rule++; if(ok) m.ruleOk++; }
    return;
  }
  const q=s.q, ok=!!it.correct;
  m.att++; if(ok) m.hit++; else m.err++;
  if(q.kind==='memory'){ m.mem++; if(ok && !q.peeked) m.memOk++; }
  if(q.kind==='inverse'){ m.inv++; if(ok) m.invOk++; }
  m.rt+=Math.max(0,s.t-q.t0); m.rtN++;
}
function loadHistory(){
  try{ const a=JSON.parse(store.get('sw-history','[]')); return Array.isArray(a)?a:[]; }catch(e){ return []; }
}
function saveSession(){
  const s=st; if(!s||s.saved||s.m.att===0) return;
  s.saved=true;
  const m=s.m, a=loadHistory();
  a.push({d:Date.now(),mode:s.mode,speed:speedKey,score:s.score,att:m.att,hit:m.hit,mem:m.mem,memOk:m.memOk,inv:m.inv,invOk:m.invOk,rule:m.rule,ruleOk:m.ruleOk,rt:m.rtN?Math.round(m.rt/m.rtN):0});
  store.set('sw-history',JSON.stringify(a.slice(-150)));
}
const pct = (a,b) => b ? Math.round(a/b*100)+'%' : '—';
function metricsHTML(m){
  const cell=(v,l)=>'<div><b>'+v+'</b><span>'+l+'</span></div>';
  let h=cell(pct(m.hit,m.att),'Precisión ('+m.hit+'/'+m.att+')');
  if(m.mem) h+=cell(m.memOk+'/'+m.mem,'Memoria');
  if(m.inv) h+=cell(m.invOk+'/'+m.inv,'Reglas invertidas');
  if(m.rule) h+=cell(m.ruleOk+'/'+m.rule,'Cambios de regla');
  if(m.rtN) h+=cell((m.rt/m.rtN/1000).toFixed(1)+' s','Tiempo medio');
  return '<div class="mx">'+h+'</div>';
}

function eat(it){
  const s=st;
  track(it);
  s.items.splice(s.items.indexOf(it),1);
  if(s.mode==='clean'){
    if(it.kind==='good'){
      addScore(10); growSnake(); s.goodCount++; s.left--; popup(it,'+10','ok'); sfx('good'); speedUp(Math.floor(s.goodCount*0.7));
      if(s.goodCount%10===0 && s.lives<3){
        s.lives++;
        s.popups.push({cx:s.snake[0].x,cy:Math.max(0,s.snake[0].y-1),text:'¡+1 vida!',kind:'ok',age:0});
      }
      updateLegend();
      if(s.left<=0) sceneComplete();
    } else {
      s.lives--; popup(it,'−1 · '+it.name+' no es basura','bad'); sfx('bad'); hurt();
      if(s.lives<=0){ updateHUD(); gameOver('Te quedaste sin vidas'); return; }
    }
  } else if(s.mode==='health'){
    if(it.kind==='bad'){
      s.lives--; popup(it,'−1 · '+it.name,'bad'); sfx('bad'); hurt();
      if(s.lives<=0){ updateHUD(); gameOver('Te quedaste sin vidas'); return; }
    } else if(s.rule==='all' || it.group===s.rule){
      addScore(10); growSnake(); s.goodCount++; popup(it,'+10','ok'); sfx('good'); speedUp(s.goodCount);
      if(s.goodCount%10===0 && s.lives<3){
        s.lives++;
        s.popups.push({cx:s.snake[0].x,cy:Math.max(0,s.snake[0].y-1),text:'¡+1 vida!',kind:'ok',age:0});
      }
      s.ruleLeft--;
      if(s.ruleLeft<=0) nextRule();
    } else {
      addScore(-5); popup(it,'−5 · es '+it.group,'bad'); sfx('bad'); hurt();
    }
    fillHealth();
  } else if(it.correct){
    const q=s.q;
    const pts=(q.kind==='memory' && !q.peeked) ? 20 : 10;
    addScore(pts); growSnake(); s.correct++; popup(it,'+'+pts,'ok'); sfx('good'); speedUp(s.correct);
    newQuestion();
  } else {
    const q=s.q;
    s.lives--;
    popup(it, s.mode==='eng' ? '−1 · '+it.word : (q.kind==='inverse' ? '−1 · ¡esa era!' : '−1'), 'bad');
    sfx('bad'); hurt();
    if(s.lives<=0){ updateHUD(); gameOver('Te quedaste sin vidas'); return; }
  }
  updateHUD();
}

function step(){
  const s=st;
  const old=s.snake, h=old[0];
  const nh={x:h.x+s.dir.x, y:h.y+s.dir.y};
  if(nh.x<0||nh.x>=N||nh.y<0||nh.y>=N){ hurt(); gameOver('¡Te chocaste con la pared!',1); return; }
  const growing=s.grow>0;
  const body=growing?old:old.slice(0,-1);
  if(body.some(p=>p.x===nh.x&&p.y===nh.y)){ hurt(); gameOver('¡Te mordiste la cola!',1); return; }
  const ns=[nh].concat(old);
  if(growing) s.grow--; else ns.pop();
  s.snake=ns;
  updateLen();
  if(s.queue.length) s.dir=s.queue.shift();
  const it=s.items.find(i=>i.x===nh.x&&i.y===nh.y);
  if(it) eat(it);
}

function frame(ts){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(64,ts-last); last=ts;
  if(!st) return;
  st.anim+=dt;
  if(st.running && !st.paused && !st.over){
    if(st.hold>0){
      st.hold=Math.max(0,st.hold-dt);
    } else {
      st.t+=dt; st.acc+=dt;
      while(st.acc>=st.tickMs && st.running && !st.over){
        st.acc-=st.tickMs; step();
        if(st.hold>0) break;
      }
      if((st.mode==='math'||st.mode==='eng') && !st.over) updateQ();
    }
  }
  if(st.sceneT>0 && !st.paused && !st.over){ st.sceneT-=dt; if(st.sceneT<=0){ st.sceneT=0; hideBanner(); setupScene(); } }
  if(st.bannerT>0 && !st.paused){ st.bannerT-=dt; if(st.bannerT<=0) hideBanner(); }
  if(st.over && !st.overShown){
    st.overT+=dt;
    if(st.overT>450){ st.overShown=true; showOverlay('over'); }
  }
  st.flash=Math.max(0,st.flash-dt/450);
  st.shake=Math.max(0,st.shake-dt/300);
  for(let i=st.popups.length-1;i>=0;i--){ st.popups[i].age+=dt; if(st.popups[i].age>1000) st.popups.splice(i,1); }
  draw();
}

/* ---------- Dibujo ---------- */
const FONT_D='"Baloo 2", ui-rounded, "Nunito", system-ui, sans-serif';
const FONT_E='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* Trayectoria del cuerpo: una línea que pasa por el centro de cada celda.
   Las esquinas se redondean y se muestrean en puntos cortos; así el cuerpo sigue
   exactamente el camino de la cabeza y las curvas se ven suaves. */
function buildPath(V,R,step){
  const P=[V[0]];
  for(let i=1;i<V.length;i++){
    const q=P[P.length-1];
    if(Math.hypot(V[i].x-q.x,V[i].y-q.y)>0.01) P.push(V[i]);
  }
  const raw=[P[0]];
  for(let i=1;i<P.length-1;i++){
    const a=P[i-1], b=P[i], d=P[i+1];
    const l1=Math.hypot(a.x-b.x,a.y-b.y), l2=Math.hypot(d.x-b.x,d.y-b.y);
    const u1={x:(a.x-b.x)/l1,y:(a.y-b.y)/l1}, u2={x:(d.x-b.x)/l2,y:(d.y-b.y)/l2};
    const cross=u1.x*u2.y-u1.y*u2.x;
    if(R<=0 || Math.abs(cross)<0.01){ raw.push(b); continue; }
    const r=Math.min(R,l1/2,l2/2);
    const A={x:b.x+u1.x*r,y:b.y+u1.y*r}, B={x:b.x+u2.x*r,y:b.y+u2.y*r};
    const m=7;
    for(let j=0;j<=m;j++){
      const t=j/m, w0=(1-t)*(1-t), w1=2*t*(1-t), w2=t*t;
      raw.push({x:w0*A.x+w1*b.x+w2*B.x, y:w0*A.y+w1*b.y+w2*B.y});
    }
  }
  if(P.length>1) raw.push(P[P.length-1]);
  const pts=[raw[0]], cum=[0];
  for(let i=1;i<raw.length;i++){
    const a=raw[i-1], b=raw[i];
    const len=Math.hypot(b.x-a.x,b.y-a.y);
    const parts=Math.max(1,Math.ceil(len/step));
    for(let j=1;j<=parts;j++){
      const t=j/parts;
      pts.push({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t});
      cum.push(cum[cum.length-1]+len/parts);
    }
  }
  return {pts,cum,L:cum[cum.length-1]};
}
function pointAt(pa,d){
  const pts=pa.pts, cum=pa.cum;
  if(d<=0) return pts[0];
  for(let i=1;i<pts.length;i++){
    if(cum[i]>=d){
      const t=(d-cum[i-1])/Math.max(1e-6,cum[i]-cum[i-1]);
      return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*t, y:pts[i-1].y+(pts[i].y-pts[i-1].y)*t};
    }
  }
  return pts[pts.length-1];
}

/* Fondo de cada escenario. Los detalles son tenues para que los iconos se lean bien. */
function curSceneForDraw(){
  /* mientras se celebra, st.scene ya apunta al siguiente escenario: se sigue mostrando el que se acaba de limpiar */
  const i = st.sceneT>0 ? st.scene-1 : st.scene;
  return SCENES[((i%SCENES.length)+SCENES.length)%SCENES.length];
}
function drawScene(sc,c,size){
  const dk=T.dark;
  const pal={parque:dk?['#1B3322','#203B28']:['#CBE6BE','#C0DEB2'], salon:dk?['#2C271D','#322C21']:['#EBE0C9','#E3D6BA'], cancha:dk?['#1D4A2B','#235632']:['#8FD18F','#82C783']}[sc.id];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const alt = sc.id==='cancha' ? (x&1) : ((x+y)&1);
    ctx.fillStyle=alt?pal[1]:pal[0]; ctx.fillRect(x*c,y*c,c,c);
  }
  if(sc.id==='parque'){
    ctx.fillStyle=dk?'rgba(214,190,140,.13)':'rgba(190,160,100,.28)';
    ctx.fillRect(0,6*c,size,2*c);
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const hh=((x*73856093)^(y*19349663))>>>0;
      if(hh%9) continue;
      const cols=['#FFFFFF','#F9A8D4','#FDE047'], col=cols[(hh>>4)%3];
      ctx.fillStyle=col; ctx.globalAlpha=dk?.28:.55;
      for(let k=0;k<3;k++){ ctx.beginPath(); ctx.arc((x+.28+.22*k)*c,(y+.35+.22*(k%2))*c,c*0.06,0,Math.PI*2); ctx.fill(); }
      ctx.globalAlpha=1;
    }
  } else if(sc.id==='salon'){
    ctx.fillStyle=dk?'rgba(40,90,70,.45)':'rgba(46,110,84,.35)';
    ctx.fillRect(0,0,size,c);
    ctx.strokeStyle=dk?'rgba(255,255,255,.28)':'rgba(255,255,255,.7)'; ctx.lineWidth=Math.max(1.5,c*0.05); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(c*1.2,c*0.65); ctx.quadraticCurveTo(c*2,c*0.2,c*3,c*0.6); ctx.quadraticCurveTo(c*3.8,c*0.9,c*4.6,c*0.45);
    ctx.moveTo(c*7,c*0.5); ctx.lineTo(c*10.5,c*0.5); ctx.stroke();
    ctx.fillStyle=dk?'rgba(190,90,90,.12)':'rgba(190,90,90,.12)';
    rr(c*3,c*4,c*8,c*7,c*0.6); ctx.fill();
  } else {
    ctx.strokeStyle=dk?'rgba(255,255,255,.35)':'rgba(255,255,255,.75)'; ctx.lineWidth=Math.max(2,c*0.09);
    ctx.strokeRect(c*0.5,c*0.5,size-c,size-c);
    ctx.beginPath(); ctx.moveTo(c*0.5,size/2); ctx.lineTo(size-c*0.5,size/2); ctx.stroke();
    ctx.beginPath(); ctx.arc(size/2,size/2,c*2,0,Math.PI*2); ctx.stroke();
    ctx.strokeRect(size/2-c*3,c*0.5,c*6,c*2.5);
    ctx.strokeRect(size/2-c*3,size-c*3,c*6,c*2.5);
  }
}

function draw(){
  const s=st, size=boardPx;
  if(!size) return;
  const c=size/N;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,size,size);
  ctx.save();
  if(s.shake>0.02){ const m=c*0.16*s.shake; ctx.translate((Math.random()-.5)*2*m,(Math.random()-.5)*2*m); }

  if(s.mode==='clean') drawScene(curSceneForDraw(),c,size);
  else for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    ctx.fillStyle=((x+y)&1)?T.cellB:T.cellA;
    ctx.fillRect(x*c,y*c,c,c);
  }

  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const it of s.items){
    const cx=(it.x+.5)*c, cy=(it.y+.5)*c;
    if(it.kind==='num'){
      const w=c*0.88, x=cx-w/2, y=cy-w/2;
      ctx.fillStyle='rgba(0,0,0,.22)'; rr(x,y+c*0.07,w,w,c*0.22); ctx.fill();
      ctx.fillStyle=T.accent; rr(x,y,w,w,c*0.22); ctx.fill();
      ctx.fillStyle=T.onAccent; ctx.font='800 '+(c*0.62)+'px '+FONT_D;
      ctx.fillText(String(it.value),cx,cy+c*0.04,c*0.8);
    } else {
      const bob=RM?0:Math.sin(s.anim/320+it.x*1.7+it.y)*c*0.035;
      ctx.fillStyle=T.disc; ctx.beginPath(); ctx.arc(cx,cy+bob,c*0.47,0,Math.PI*2); ctx.fill();
      if((s.mode==='health'||s.mode==='clean') && s.goodCount<8){
        const match=ruleMatch(it);
        ctx.save();
        ctx.globalAlpha=1-s.goodCount/8;
        ctx.lineWidth=Math.max(2,c*0.08);
        ctx.strokeStyle=it.kind==='bad'?T.danger:(match?T.ok:T.muted);
        ctx.setLineDash(match?[]:[c*0.14,c*0.1]);
        ctx.beginPath(); ctx.arc(cx,cy+bob,c*0.5,0,Math.PI*2); ctx.stroke();
        ctx.restore();
      }
      ctx.font=(it.kind==='icon'?c*0.66:c*0.62)+'px '+FONT_E;
      ctx.fillStyle=T.fg;
      ctx.fillText(it.emoji,cx,cy+bob+c*0.04);
    }
  }
  ctx.globalAlpha=1;

  /* serpiente: la cabeza va hacia la siguiente celda y llega justo cuando termina el turno */
  const sk=curSkin(), shp=curShape();
  const k=s.over?s.freezeK:(s.started?Math.min(1,s.acc/s.tickMs):0);
  const n=s.snake.length, H0=s.snake[0];
  let hx=H0.x+s.dir.x*k, hy=H0.y+s.dir.y*k;
  hx=Math.min(N-0.96,Math.max(-0.04,hx)); hy=Math.min(N-0.96,Math.max(-0.04,hy));
  const V=[{x:(hx+.5)*c,y:(hy+.5)*c}];
  for(let i=0;i<n;i++) V.push({x:(s.snake[i].x+.5)*c,y:(s.snake[i].y+.5)*c});
  if(s.grow<=0 && n>=2){
    const a=s.snake[n-1], b=s.snake[n-2];
    V[V.length-1]={x:(a.x+(b.x-a.x)*k+.5)*c, y:(a.y+(b.y-a.y)*k+.5)*c};
  }
  const square=shp==='cuadrada', pieces=(shp==='bloques'||shp==='cuentas');
  const R=(square||pieces)?0:c*0.5;
  const pa=buildPath(V,R,c*0.3);
  const hue=d=>((d/c*24-s.anim/9)%360+360)%360;
  const colAt=d=>sk.rainbow?'hsl('+hue(d).toFixed(0)+',88%,56%)':sk.color;
  const cnt=Math.floor(pa.L/c+1e-6);

  if(pieces){
    for(let j=cnt;j>=1;j--){
      const p=pointAt(pa,j*c);
      for(let pass=0;pass<2;pass++){
        if(pass===1 && j%2===0) break;
        ctx.fillStyle=pass===0?colAt(j*c):'rgba(255,255,255,.16)';
        if(shp==='bloques') rr(p.x-c*0.4,p.y-c*0.4,c*0.8,c*0.8,c*0.16);
        else { ctx.beginPath(); ctx.arc(p.x,p.y,c*0.4,0,Math.PI*2); }
        ctx.fill();
      }
    }
  } else {
    ctx.lineWidth=shp==='fina'?c*0.42:(square?c*0.8:c*0.74);
    ctx.lineCap=square?'square':'round'; ctx.lineJoin=square?'miter':'round'; ctx.miterLimit=3;
    const pts=pa.pts;
    if(sk.rainbow){
      for(let i=pts.length-1;i>=1;i--){
        ctx.strokeStyle=colAt((pa.cum[i]+pa.cum[i-1])/2);
        ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[i-1].x,pts[i-1].y); ctx.stroke();
      }
    } else {
      ctx.strokeStyle=sk.color; ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
      ctx.stroke();
    }
    if(shp!=='fina'){
      ctx.fillStyle='#FFFFFF'; ctx.globalAlpha=.22;
      for(let j=2;j<=cnt;j+=2){ const p=pointAt(pa,j*c); ctx.beginPath(); ctx.arc(p.x,p.y,c*0.2,0,Math.PI*2); ctx.fill(); }
      ctx.globalAlpha=1;
    }
  }

  const hp=pa.pts[0], d=s.dir, px=-d.y, py=d.x;
  const headPath=()=>{
    if(square||shp==='bloques'){ const r=c*0.46; rr(hp.x-r,hp.y-r,r*2,r*2,square?c*0.12:c*0.18); }
    else { ctx.beginPath(); ctx.arc(hp.x,hp.y,shp==='fina'?c*0.42:c*0.46,0,Math.PI*2); }
  };
  ctx.fillStyle=colAt(0); headPath(); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.14)'; headPath(); ctx.fill();
  for(const sd of [-1,1]){
    const ex=hp.x+d.x*c*0.12+px*sd*c*0.17, ey=hp.y+d.y*c*0.12+py*sd*c*0.17;
    ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.arc(ex,ey,c*0.14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#10201A'; ctx.beginPath(); ctx.arc(ex+d.x*c*0.05,ey+d.y*c*0.05,c*0.07,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  for(const p of s.popups){
    const a=p.age/1000, x=(p.cx+.5)*c, y=(p.cy+.5)*c-a*c*1.3;
    const px2=Math.min(size-c*2.5,Math.max(c*2.5,x));
    ctx.globalAlpha=Math.max(0,1-a*a);
    ctx.font='800 '+(c*0.56)+'px '+FONT_D;
    ctx.lineWidth=c*0.14; ctx.lineJoin='round';
    ctx.strokeStyle=T.surface; ctx.strokeText(p.text,px2,y);
    ctx.fillStyle=p.kind==='ok'?T.ok:T.danger; ctx.fillText(p.text,px2,y);
  }
  ctx.globalAlpha=1;

  if(s.flash>0.02){ ctx.globalAlpha=s.flash*.28; ctx.fillStyle=T.danger; ctx.fillRect(0,0,size,size); ctx.globalAlpha=1; }
}

/* ---------- Entradas ---------- */
let sw=null;
gameEl.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')) return;
  sw={x:e.clientX,y:e.clientY};
});
window.addEventListener('pointermove',e=>{
  if(!sw) return;
  const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>=12){
    if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1,0); else turn(0,dy>0?1:-1);
    sw.x=e.clientX; sw.y=e.clientY;
  }
});
window.addEventListener('pointerup',()=>{ sw=null; });
window.addEventListener('pointercancel',()=>{ sw=null; });

const KEYS={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
window.addEventListener('keydown',e=>{
  if(!resEl.hidden){ if(e.key==='Escape') closeResults(); return; }
  if(!st) return;
  if(KEYS[e.key]){ e.preventDefault(); turn(KEYS[e.key][0],KEYS[e.key][1]); return; }
  if(e.key==='m'||e.key==='M'){ setSound(!soundOn); return; }
  const onBtn=!!(e.target.closest&&e.target.closest('button'));
  if((e.key===' '||e.key==='p'||e.key==='P') && !onBtn){
    e.preventDefault();
    if(st.started && !st.over) setPause(!st.paused);
  } else if(e.key==='Enter' && !onBtn && st.overShown){
    startGame(mode);
  } else if(e.key==='Escape' && st.started && !st.over){
    setPause(!st.paused);
  }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) setPause(true); });
window.addEventListener('resize',()=>{ if(st) fit(); });
window.addEventListener('orientationchange',()=>{ if(st) setTimeout(fit,150); });
if(window.ResizeObserver){ try{ new ResizeObserver(()=>{ if(st) fit(); }).observe(areaEl); }catch(e){} }

try{

}catch(e){}



/* ---------- Mis resultados ---------- */
const resEl=$('#results');
function renderResults(){
  const a=loadHistory(), box=$('#res-body');
  if(!a.length){ box.innerHTML='<p class="res-empty">Aún no hay partidas guardadas. Juega una y vuelve a mirar.</p>'; return; }
  let html='';
  Object.keys(MODES).forEach(k=>{
    const r=a.filter(x=>x.mode===k); if(!r.length) return;
    const valid=r.filter(x=>x.att>=10);
    const acc=x=>x.hit/x.att;
    let line='';
    if(valid.length){
      const bestA=Math.max.apply(null,valid.map(acc));
      line='Mejor precisión: <b>'+Math.round(bestA*100)+'%</b>';
      if(valid.length>=2) line+=' · Primera → última: <b>'+Math.round(acc(valid[0])*100)+'% → '+Math.round(acc(valid[valid.length-1])*100)+'%</b>';
    } else line='Se necesitan partidas con al menos 10 intentos para calcular la precisión.';
    html+='<div class="res-mode"><strong>'+MODES[k].name+'</strong> · '+r.length+(r.length===1?' partida':' partidas')+'<br>'+line+'</div>';
  });
  html+='<table class="res-list"><thead><tr><th>Fecha</th><th>Modo</th><th>Prec.</th><th>Pts</th></tr></thead><tbody>';
  a.slice(-8).reverse().forEach(x=>{
    const d=new Date(x.d);
    html+='<tr><td>'+d.getDate()+'/'+(d.getMonth()+1)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'</td><td>'+(MODES[x.mode]?MODES[x.mode].name:x.mode)+'</td><td>'+pct(x.hit,x.att)+' ('+x.hit+'/'+x.att+')</td><td>'+x.score+'</td></tr>';
  });
  html+='</tbody></table>';
  box.innerHTML=html;
}
function openResults(){ renderResults(); $('#res-clear').textContent='Borrar'; resEl.hidden=false; $('#res-close').focus(); }
function closeResults(){ resEl.hidden=true; $('#btn-results').focus(); }
function downloadCSV(){
  const a=loadHistory();
  const head='fecha,modo,velocidad,puntos,intentos,aciertos,precision_pct,memoria_ok,memoria_total,inversas_ok,inversas_total,cambios_regla_ok,cambios_regla_total,tiempo_medio_ms';
  const rows=a.map(x=>[new Date(x.d).toISOString(),x.mode,x.speed||'',x.score,x.att,x.hit,x.att?Math.round(x.hit/x.att*100):'',x.memOk,x.mem,x.invOk,x.inv,x.ruleOk,x.rule,x.rt].join(','));
  try{
    const blob=new Blob([head+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
    const u=URL.createObjectURL(blob), l=document.createElement('a');
    l.href=u; l.download='serpiente-sabia-resultados.csv'; document.body.appendChild(l); l.click(); l.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1000);
  }catch(e){}
}

$('#res-csv').addEventListener('click',downloadCSV);
